<!-- Modal para editar perfil rápido -->
<div class="zw-modal-overlay" id="profileModalOverlay">
  <div class="zw-modal">
    <div class="zw-modal-header">
      <h3 class="zw-modal-title">Editar Perfil</h3>
      <button class="zw-modal-close" id="btnCloseProfileModal" aria-label="Cerrar">&times;</button>
    </div>
    <form id="profileEditForm">
      <div style="display:flex; flex-direction:column; gap:14px;">
        <div class="form-group">
          <label class="form-label" for="editUserName">Nombre</label>
          <input type="text" class="form-input" id="editUserName" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="editUserEmail">Correo electrónico</label>
          <input type="email" class="form-input" id="editUserEmail">
        </div>
      </div>
      <div class="zw-modal-footer">
        <button type="button" class="btn-cancel" id="btnCancelProfileModal" style="padding:9px 18px; border-radius:10px;">Cancelar</button>
        <button type="submit" class="btn-primary-sm" style="padding:10px 22px; border-radius:10px;">Guardar cambios</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="alert"></div>

<script src="../shared/store.js"></script>
<script src="script.js"></script>
